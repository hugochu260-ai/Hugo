<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Lab 8 Q3 — Person and Author</title>
</head>
<body>
<pre id="out"></pre>
<script>
  // Private fields (#name, #books) are the ES2022 class feature named in the question.
  class Person {
    #name;

    constructor(name) {
      this.#name = name;
    }

    getName() {
      return this.#name;
    }
  }

  class Author extends Person {
    #books;

    constructor(name, books) {
      super(name);
      this.#books = books;
    }

    getBooks() {
      return this.#books;
    }
  }

  const person = new Person("John Smith");
  const authors = [
    new Author("Dustin Diaz", ["JavaScript Design Patterns"]),
    new Author("Ross Harmes", ["JavaScript Design Patterns"])
  ];

  const lines = [person.getName()];
  for (const author of authors) {
    lines.push(author.getName());
    for (const book of author.getBooks()) {
      lines.push(book);
    }
  }

  // Required output goes to the console. The page shows the same lines.
  for (const line of lines) {
    console.log(line);
  }
  document.getElementById("out").textContent = lines.join("\n");
</script>
</body>
</html>
