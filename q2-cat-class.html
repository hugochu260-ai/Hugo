<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Lab 8 Q2 — Cat class</title>
</head>
<body>
<script>
  class Cat {
    constructor(name, gender) {
      this.name = name;
      this.gender = gender;
    }

    getName() {
      return this.name;
    }

    getGender() {
      return this.gender;
    }

    setName(name) {
      this.name = name;
    }

    setGender(gender) {
      this.gender = gender;
    }
  }

  const cat = new Cat("Thomas", "male");

  document.write("Create a cat object using constructor<br>");
  document.write("class: " + cat.constructor.name.toLowerCase() + "<br>");
  document.write("cat.name: " + cat.getName() + "<br>");
  document.write("cat.gender: " + cat.getGender() + "<br>");
  document.write("<br>");

  document.write("Change the properties using set Methods<br>");
  cat.setName("Kitty");
  cat.setGender("female");
  document.write("class: " + cat.constructor.name.toLowerCase() + "<br>");
  document.write("cat.name: " + cat.getName() + "<br>");
  document.write("cat.gender: " + cat.getGender() + "<br>");
</script>
</body>
</html>
