<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Lab 8 Q1 — new Object</title>
</head>
<body>
<script>
  // Q1 (1): build a cat with the built-in Object type.
  const cat = new Object();
  cat.name = "Kitty";
  cat.gender = "female";

  document.write("class: cat<br>");
  document.write("cat.name: " + cat.name + "<br>");
  document.write("cat.gender: " + cat.gender + "<br>");
</script>
</body>
</html>
