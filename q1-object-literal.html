<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Lab 8 Q1 — object literal</title>
</head>
<body>
<script>
  // Q1 (2): the same cat, written as an object literal.
  const cat = {
    name: "Kitty",
    gender: "female"
  };

  document.write("class: cat<br>");
  document.write("cat.name: " + cat.name + "<br>");
  document.write("cat.gender: " + cat.gender + "<br>");
</script>
</body>
</html>
